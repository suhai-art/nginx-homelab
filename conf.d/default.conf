server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/front-end;
    # index index.html;

    access_log /var/log/nginx/invalid-access.log main;
    error_log /var/log/nginx/invalid-error.log warn;

    location = /health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
