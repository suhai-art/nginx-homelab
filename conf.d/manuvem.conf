# Repassa o esquema original (https) enviado pela Cloudflare
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Só envia "Connection: upgrade" em requisições WebSocket,
# preservando o keepalive do upstream nas demais
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream manuvem {
    server manuvem.lan;

    keepalive 32;
}

server {
    listen 80;
    server_name manuvem.suhai.art.br;

    client_max_body_size 10G;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://manuvem;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }
}
