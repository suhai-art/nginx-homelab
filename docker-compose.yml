services:
    nginx:
        build:
            context: ./
            dockerfile: Dockerfile
            args:
                NGINX_VERSION: 1.27-alpine
        container_name: nginx
        restart: unless-stopped
        environment:
            - TZ=${TZ}
        ports:
            - "80:80"
        volumes:
            - nginx_logs:/var/log/nginx
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./conf.d:/etc/nginx/conf.d:ro
            - nginx_tmp:/tmp/nginx
            - ./apps/front-end:/var/www/front-end:ro
            - ./apps/vita-rescue:/var/www/vita-rescue:ro
        networks:
            - nginx_network
        healthcheck:
            test: 
                [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        tmpfs:
            - /var/run:mode=0755
            - /var/cache/nginx:mode=0755

    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: cloudflared
        restart: unless-stopped
        command: tunnel --no-autoupdate run --protocol http2
        environment:
            - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN is not defined}
            - TUNNEL_LOGLEVEL=info
            - TUNNEL_TRANSPORT_LOGLEVEL=warn
        networks:
            - nginx_network
        depends_on:
            nginx:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:2000/metrics || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp:mode=0755

volumes:
    nginx_logs:
        driver: local
    nginx_cache:
        driver: local
    nginx_tmp:
        driver: local

networks:
    nginx_network:
        driver: bridge
        ipam:
            config:
              - subnet: 172.20.0.0/24
