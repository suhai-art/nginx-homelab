services:
    nginx:
        build:
            context: ./
            dockerfile: Dockerfile
            args:
                NGINX_VERSION: 1.27-alpine
        container_name: nginx
        restart: unless-stopped
        environment:
            - TZ=America/Sao_Paulo
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - nginx_logs:/var/log/nginx
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./conf.d:/etc/nginx/conf.d
            - ./letsencrypt:/etc/letsencrypt
        networks:
            - nginx_network

    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: cloudflared
        restart: unless-stopped
        command: tunnel --no-autoupdate run --protocol http2
        environment:
            - TUNNEL_TOKEN=${TUNNEL_TOKEN}
            - TUNNEL_LOGLEVEL=info
            - TUNNEL_TRANSPORT_LOGLEVEL=warn
        networks:
            - nginx_network
        depends_on:
            - nginx
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:2000/metrics || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 3

volumes:
    nginx_logs:
        driver: local

networks:
    nginx_network:
        driver: bridge
